---
# Static, cluster-agnostic Cilium defaults. Per-cluster values (cluster.name,
# cluster.id, Prometheus Operator ServiceMonitors on the hub only) are rendered
# into values.generated.yaml by kubara from the cluster context.
#
# The CNI itself is bootstrapped by build-mesh.sh on first boot; this chart lets
# Argo CD adopt the same release for ongoing GitOps management. Keep these
# values in sync with the `cilium install --set` flags in
# z-demo-setup/scripts/build-mesh.sh, or the two managers will fight.
cilium:
  kubeProxyReplacement: true
  ipam:
    mode: kubernetes
  image:
    pullPolicy: IfNotPresent
  clustermesh:
    apiserver:
      replicas: 1
      service:
        # Static NodePort band (30000-30085); the 32379 default can be taken
        # by a dynamic allocation first. Keep in sync with build-mesh.sh.
        nodePort: 30079
  prometheus:
    enabled: true
  operator:
    # One node per kind cluster, and the operator binds host ports: a 2nd
    # replica (chart default) can never schedule and the rollout hangs.
    replicas: 1
    prometheus:
      enabled: true
  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true
    metrics:
      enabled:
        - dns
        - drop
        - tcp
        - flow
        - http
        - icmp
    tls:
      auto:
        enabled: true
        method: cronJob
  # Ingress controller: replaces traefik as the cluster ingressClass ("cilium").
  # Shared mode -> a single cilium-ingress LoadBalancer service in kube-system
  # fronts every Ingress (see AGENTS.md: no loadBalancerIP pins, DNS chases the
  # live LB IP).
  ingressController:
    enabled: true
    loadbalancerMode: shared
