kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hub
# Local kind spokes for the kubara demo. The hub is managed separately.
clusters:
  - name: kubara-spoke-1
    stage: dev
    kind_config: spoke-1.yaml
  - name: kubara-spoke-2
    stage: prod
    kind_config: spoke-2.yaml
nodes:
- role: control-plane
  extraMounts:
  - hostPath: /etc/ssl/certs/ca-certificates.crt
    containerPath: /etc/ssl/certs/ca-certificates.crt
    readOnly: true
networking:
  disableDefaultCNI: true
  podSubnet: "10.10.0.0/16"
  serviceSubnet: "10.96.0.0/16"

