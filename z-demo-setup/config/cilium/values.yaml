kubeProxyReplacement: true
ipam:
  mode: kubernetes
image:
  pullPolicy: IfNotPresent
prometheus:
  enabled: true
operator:
  # One node per kind cluster; a 2nd replica can never schedule.
  replicas: 1
clustermesh:
  apiserver:
    replicas: 1
    service:
      nodePort: 30079   # static NodePort band, see build-mesh.sh
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - http
      - icmp
  tls:
    auto:
      enabled: true
      method: cronJob
ingressController:
  # Replaces traefik as the cluster ingressClass ("cilium"). Shared mode
  # keeps a single cilium-ingress LoadBalancer service in kube-system.
  enabled: true
  loadbalancerMode: shared
