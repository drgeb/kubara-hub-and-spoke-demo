kubeProxyReplacement: true
ipam:
  mode: kubernetes
image:
  pullPolicy: IfNotPresent
prometheus:
  enabled: true
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - http
      - icmp
  tls:
    auto:
      enabled: true
      method: cronJob
ingressController:
  # Replaces traefik as the cluster ingressClass ("cilium"). Shared mode
  # keeps a single cilium-ingress LoadBalancer service in kube-system.
  enabled: true
  loadbalancerMode: shared
