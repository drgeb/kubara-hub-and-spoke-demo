kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: test-cluster
nodes:
- role: control-plane
  extraMounts:
  - hostPath: /etc/ssl/certs/ca-certificates.crt
    containerPath: /etc/ssl/certs/ca-certificates.crt
    readOnly: true
networking:
  disableDefaultCNI: true
# Note: the containerd registry trust for harbor.<LB IP>.traefik.me is applied
# at runtime by bin/setup-go-hello.sh (the LB IP is only known after the
# cluster is up); it cannot live here with a correct value.
