apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "liquibase-bootstrap.fullname" . }}-init
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "{{ printf "%d" (sub (int .Values.bootstrap.hookWeight) 1) }}"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  init-db.sh: |
    #!/bin/sh
    set -e

    echo "==> Connecting to PostgreSQL at {{ .Values.db.host }}:{{ .Values.db.port }}"

    PGPASSWORD="$POSTGRES_PASSWORD" psql -h {{ .Values.db.host }} -p {{ .Values.db.port }} -U postgres -c "SELECT 1" >/dev/null 2>&1 || {
      echo "ERROR: Cannot connect to PostgreSQL"
      exit 1
    }

    echo "==> Creating roles and databases..."

    {{- range .Values.services }}
    echo "  -> Processing {{ .name }}..."

    # Create role if not exists
    PGPASSWORD="$POSTGRES_PASSWORD" psql -h {{ $.Values.db.host }} -p {{ $.Values.db.port }} -U postgres -c "
      DO \$$ BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ .name }}') THEN
          CREATE ROLE {{ .name }} LOGIN PASSWORD '$(cat /secrets/{{ .name }}-password)';
        END IF;
      END \$$;
    " || echo "    WARN: Role {{ .name }} creation skipped (may already exist)"

    # Create database if not exists
    PGPASSWORD="$POSTGRES_PASSWORD" psql -h {{ $.Values.db.host }} -p {{ $.Values.db.port }} -U postgres -c "
      SELECT 'CREATE DATABASE {{ .name }} OWNER {{ .name }}'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ .name }}')
    " -t -A | PGPASSWORD="$POSTGRES_PASSWORD" psql -h {{ $.Values.db.host }} -p {{ $.Values.db.port }} -U postgres || true

    echo "    {{ .name }}: done"
    {{- end }}

    echo "==> Bootstrap complete."
