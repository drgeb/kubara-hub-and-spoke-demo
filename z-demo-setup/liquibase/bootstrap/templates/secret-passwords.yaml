apiVersion: v1
kind: Secret
metadata:
  name: {{ include "liquibase-bootstrap.fullname" . }}-passwords
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "{{ printf "%d" (sub (int .Values.bootstrap.hookWeight) 2) }}"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{- range .Values.services }}
  {{ .name }}-password: {{ .password | quote }}
  {{- end }}
