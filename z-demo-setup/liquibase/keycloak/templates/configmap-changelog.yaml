apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "liquibase-service.fullname" . }}-changelog
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "{{ printf "%d" (sub (int .Values.liquibase.hookWeight) 1) }}"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  db.changelog-master.yaml: |
    {{- .Files.Get "changelogs/db.changelog-master.yaml" | nindent 4 }}
  v1.0-001-init.sql: |
    {{- .Files.Get "changelogs/v1.0/001-init.sql" | nindent 4 }}
