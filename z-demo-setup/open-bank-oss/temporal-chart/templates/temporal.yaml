{{- $labels := dict "app.kubernetes.io/name" "temporal" "app.kubernetes.io/part-of" "openbank" -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: temporal-data
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  replicas: 1
  # SQLite on a RWO volume: never two servers on one database file.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        {{- toYaml $labels | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [temporal]
          args:
            - server
            - start-dev
            - --ip=0.0.0.0
            - --port=7233
            - --ui-port=8233
            - --db-filename=/data/temporal.db
            {{- range .Values.namespaces }}
            - --namespace={{ . }}
            {{- end }}
          ports:
            - {name: grpc, containerPort: 7233}
            - {name: ui, containerPort: 8233}
          readinessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: grpc}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: temporal-data
        - name: tmp
          emptyDir: {}
---
# Services reach the frontend at temporal.<namespace>.svc:7233.
apiVersion: v1
kind: Service
metadata:
  name: temporal
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - {name: grpc, port: 7233, targetPort: grpc, appProtocol: grpc}
    - {name: ui, port: 8233, targetPort: ui}
{{- if .Values.ui.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temporal-ui
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ui.ingress.className }}
  rules:
    - host: {{ required "ui.ingress.host is required" .Values.ui.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: temporal
                port:
                  name: ui
{{- end }}
