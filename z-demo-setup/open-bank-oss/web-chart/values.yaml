# Defaults for one OpenBank web front-end. Per-app values live in the gitops repo at
# stages/<stage>/<app>/values.yaml (written by open-bank-oss-services.sh) and
# stages/<stage>/<app>/image.yaml (image.tag, owned by Kargo).
name: ""
replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

port: 8080
# HTTP path for readiness/liveness (200 or a redirect counts).
probePath: /

env: []
# Secret whose keys all become env vars (generated by open-bank-oss-services.sh).
appSecret: ""

# PEM CA bundle mounted at /etc/kubara-ca/ca.crt (mesh CA, for HTTPS to Keycloak);
# set NODE_EXTRA_CA_CERTS to that path for Node apps.
caSecret: ""

# Read-only Kubernetes API access for in-cluster service discovery (admin-ui lists
# Deployments in OPENBANK_NAMESPACES).
rbac:
  enabled: false

ingress:
  enabled: true
  className: cilium
  host: ""
  # TLS Secret (tls.crt/tls.key) for the host; empty = plain HTTP.
  tlsSecret: ""

# Writable scratch directories (emptyDir) inside a read-only/root-owned image,
# e.g. admin-ui's Next.js image cache /app/.next/cache.
writableDirs: []

securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
