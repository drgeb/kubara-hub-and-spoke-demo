{{- $labels := dict "app.kubernetes.io/name" "openbank-redis" "app.kubernetes.io/part-of" "openbank" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbank-redis
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openbank-redis
  template:
    metadata:
      labels:
        {{- toYaml $labels | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.image }}
          args: ["--save", "", "--appendonly", "no", "--databases", {{ .Values.databases | quote }}]
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: openbank-redis
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: openbank-redis
  ports:
    - {name: redis, port: 6379, targetPort: redis}
