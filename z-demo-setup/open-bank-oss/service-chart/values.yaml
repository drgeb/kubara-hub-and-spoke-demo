# Defaults for one OpenBank service. Per-service values live in the gitops repo at
# stages/<stage>/<service>/values.yaml (written by open-bank-oss.sh) and
# stages/<stage>/<service>/image.yaml (image.tag, owned by Kargo).

# Short service name: engagement, incentive, account, party, ...
name: ""

replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# The service's HTTP port (upstream module Dockerfile EXPOSE). Health lives on
# the management port (openbank-libs-runtime default 8085, /q/health/*; some
# services override it, e.g. incentive 8087).
port: 8080
managementPort: 8085

database:
  # false for services without a datasource (clearing-simulator, ap2, customer-edge).
  enabled: true
  host: postgresql.postgresql.svc.cluster.local
  port: 5432
  name: ""
  # Secret with keys username/password, created by open-bank-oss.sh (never in git).
  existingSecret: ""
  # Every service shares one postgres (kubara-dev: max_connections 300). Upstream
  # pools (reactive max-size 20 + JDBC) exhausted the default 100 at 11 services,
  # so cap them. JDBC serves Flyway (and a few JDBC beans) and idles to 0; at 2,
  # ledger's start-up timed out acquiring one ("Sorry, acquisition timeout!").
  reactiveMaxSize: 4
  jdbcMaxSize: 5

kafka:
  bootstrapServers: openbank-cluster-kafka-bootstrap.kafka.svc:9092

oidc:
  # Base URL of Keycloak; services append /realms/<realm>.
  keycloakUrl: ""
  realm: openbank
  clientId: openbank-services
  # Secret with key client-secret, created by open-bank-oss.sh (never in git).
  existingSecret: openbank-oidc
  # Secret (key client-secret) of the service's own named "m2m" OIDC client,
  # if it has one (account, party); empty = reuse existingSecret.
  m2mSecret: ""
  # The mesh CA inside the image (z-demo-setup/open-bank-oss/kubara-image).
  caFile: /app/config/kubara-ca.crt
  # Named oidc-client entries the module defines (account/party: [m2m]); each
  # is pointed at the kubara-ca TLS config.
  namedClients: []

# OpenBank enforces authz through an OPA sidecar upstream. The demo runs without
# it, so authz is advisory (the AuthorizeInterceptor fails closed otherwise).
authzEnforce: false

# Optional per-service Redis (account and party need one for their approval store).
redis:
  enabled: false
  image: docker.io/library/redis:7.4-alpine

# Temporal workflows. Upstream reads openbank.temporal.server-url (some modules
# via TEMPORAL_SERVER_URL); enabled points both at the demo Temporal dev server
# (z-demo-setup/open-bank-oss/temporal-chart). The namespace stays the module's own.
temporal:
  enabled: false
  serverUrl: temporal.temporal.svc:7233

# Extra Quarkus config written to an override.properties ConfigMap with a high
# config_ordinal (upstream's msg-override pattern: dotted Kafka channel keys).
configOverrides: {}

extraEnv: []

# Name of a Secret whose keys are all injected as env vars (service-specific
# secrets such as PROMO_CODE_PEPPER). Created by open-bank-oss-services.sh.
appSecret: ""

# East-west mTLS client keypairs some services load at startup (account:
# sca-tls, party-tls). Each Secret holds tls.crt, tls.key and ca.crt, generated
# by open-bank-oss-services.sh from a demo CA (upstream: cert-manager).
#   - {name: sca-tls, mountPath: /mnt/sca-tls, secretName: account-sca-tls}
tlsMounts: []

ingress:
  enabled: false
  className: cilium
  host: ""

# Upstream's image entrypoint hard-codes -XX:+UseZGC, whose off-heap overhead
# (~680Mi working set per service here) does not fit ~50 services on a laptop
# kind mesh. The demo runs the same jar with SerialGC instead; empty list =
# keep the image entrypoint.
jvm:
  command:
    - java
    - -XX:+UseSerialGC
    - -Djava.util.logging.manager=org.jboss.logmanager.LogManager
    - -jar
    - /app/quarkus-run.jar

# Heap as a share of the container limit (ZGC needed 40% of 1Gi to avoid OOM;
# SerialGC's overhead is far smaller).
javaOpts: "-XX:MaxRAMPercentage=50 -XX:TieredStopAtLevel=1 -Xss512k"

resources:
  requests:
    cpu: 50m
    memory: 384Mi
  limits:
    memory: 768Mi
