apiVersion: kubara.io/v1alpha1
kind: ServiceDefinition
metadata:
  name: keycloak
spec:
  chartPath: keycloak
  clusterTypes:
  - hub
  - spoke
  status: disabled
  configSchema:
    type: object
    properties:
      host:
        type: string
      adminUser:
        type: string
      adminPassword:
        type: string
      database:
        type: object
        properties:
          host:
            type: string
          port:
            type: integer
          name:
            type: string
          username:
            type: string
          password:
            type: string
      replicas:
        type: integer
