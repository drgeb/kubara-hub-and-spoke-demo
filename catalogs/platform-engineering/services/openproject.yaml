apiVersion: kubara.io/v1alpha1
kind: ServiceDefinition
metadata:
  name: openproject
spec:
  chartPath: openproject
  clusterTypes:
  - hub
  - spoke
  status: disabled
  configSchema:
    type: object
    properties:
      host:
        type: string
      adminPassword:
        type: string
      adminName:
        type: string
      adminEmail:
        type: string
      secretKeyBase:
        type: string
      database:
        type: object
        properties:
          host:
            type: string
          port:
            type: integer
          name:
            type: string
          username:
            type: string
          password:
            type: string
      storage:
        type: object
        properties:
          size:
            type: string
      replicas:
        type: integer
