apiVersion: kubara.io/v1alpha1
kind: ServiceDefinition
metadata:
  name: forgejo
spec:
  chartPath: forgejo
  clusterTypes:
  - hub
  - spoke
  status: disabled
  configSchema:
    type: object
    properties:
      host:
        type: string
      admin:
        type: object
        properties:
          email:
            type: string
          password:
            type: string
          username:
            type: string
      database:
        type: object
        properties:
          host:
            type: string
          name:
            type: string
          password:
            type: string
          user:
            type: string
      tls:
        type: object
        properties:
          enabled:
            type: boolean
          issuerRef:
            type: object
            properties:
              kind:
                type: string
              name:
                type: string
