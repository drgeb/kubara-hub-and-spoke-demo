apiVersion: kubara.io/v1alpha1
kind: ServiceDefinition
metadata:
  name: apicurio
spec:
  chartPath: apicurio
  clusterTypes:
  - hub
  - spoke
  status: disabled
  configSchema:
    type: object
    properties:
      hostname:
        type: string
      database:
        type: object
        properties:
          host:
            type: string
          port:
            type: integer
          name:
            type: string
          username:
            type: string
          password:
            type: string
      image:
        type: object
        properties:
          tag:
            type: string
      sync:
        type: object
        properties:
          enabled:
            type: boolean
