apiVersion: kubara.io/v1alpha1
kind: ServiceDefinition
metadata:
  name: nexus
spec:
  chartPath: nexus
  clusterTypes:
  - hub
  - spoke
  status: disabled
  configSchema:
    type: object
    properties:
      hostname:
        type: string
      adminPassword:
        type: string
      tls:
        type: object
        properties:
          enabled:
            type: boolean
          issuerRef:
            type: object
            properties:
              kind:
                type: string
              name:
                type: string
