# Expose Forgejo SSH externally via a LoadBalancer handled by cloud-provider-kind.
# No loadBalancerIP pin: the LB IP is dynamic, and the ssh hostname below is
# resolved by dnsmasq/config/dnsmasq.conf (regenerated from the live IP by
# `just -f dnsmasq/Justfile refresh-lb-hosts`). See AGENTS.md.
service:
  ssh:
    type: LoadBalancer
gitea:
  # NOTE: DB password env lives under deployment.env in
  # values.generated.yaml.tplt (chart renders deployment.env, not gitea.env);
  # only chart-consumed overrides belong here.
  config:
    server:
      SSH_DOMAIN: forgejo-ssh.me
    actions:
      ENABLED: "true"
      DEFAULT_ACTIONS_URL: github
