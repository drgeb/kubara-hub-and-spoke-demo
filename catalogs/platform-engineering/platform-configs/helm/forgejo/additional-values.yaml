# Expose Forgejo SSH externally via a LoadBalancer handled by cloud-provider-kind.
# The loadBalancerIP / SSH_DOMAIN values are rendered at runtime by
# scripts/render-runtime-config.sh (FORGEJO_SSH_IP); they are requested before
# the Service exists, so they are a deliberate static pin, not a discovery.
service:
  ssh:
    type: LoadBalancer
    loadBalancerIP: 172.19.0.9
gitea:
  env:
    # environment-to-ini only consumes FORGEJO__-prefixed envs; the generated
    # GITEA__database__PASSWD never reaches app.ini, so gitea migrate connects
    # with an empty password. Use the prefix the image actually reads.
    - name: FORGEJO__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-credentials
          key: password
  config:
    server:
      SSH_DOMAIN: 172.19.0.9
    actions:
      ENABLED: "true"
      DEFAULT_ACTIONS_URL: github
