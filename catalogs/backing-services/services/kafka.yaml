apiVersion: kubara.io/v1alpha1
kind: ServiceDefinition
metadata:
  name: kafka
spec:
  chartPath: kafka
  clusterTypes:
  - hub
  - spoke
  status: disabled
  configSchema:
    type: object
    properties:
      name:
        type: string
      replicas:
        type: integer
      version:
        type: string
      persistence:
        type: object
        properties:
          size:
            type: string
          storageClass:
            type: string