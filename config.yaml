        status: enabled
      kafka:
        status: disabled
      kube-prometheus-stack:
        status: disabled
      kyverno:
        status: disabled
      kyverno-policies:
        status: disabled
      kyverno-policy-reporter:
        status: disabled
      loki:
        status: disabled
      longhorn:
        status: disabled
      metallb:
        status: disabled
      metrics-server:
        status: disabled
      oauth2-proxy:
        status: disabled
      ollama:
        status: disabled
      postgresql:
        status: enabled
        config:
          database:
            name: app
            username: app
          persistence:
            size: 8Gi
            storageClass: ""
      postgresql19:
        status: disabled
      reloader:
        status: disabled
      traefik:
