traefik:
  api:
    basePath: /traefik
  ingressRoute:
    dashboard:
      enabled: true
      entryPoints:
        - websecure
      matchRule: Host(`hub.kubara.test`) && PathPrefix(`/traefik`)
      tls: {}
  # NOTE: no service.spec.loadBalancerIP. LB IPs are dynamic (cloud-provider-kind);
  # the only IP map in the repo is dnsmasq/config/dnsmasq.conf (see AGENTS.md).
