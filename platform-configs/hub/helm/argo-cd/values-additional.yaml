bootstrapValues:
  projects:
    hub-local:
      sourceRepos:
        - "https://github.com/drgeb/kubara-hub-and-spoke-demo.git"
        - "https://charts.external-secrets.io/"
        - "https://charts.jetstack.io"
        - "https://prometheus-community.github.io/helm-charts"
        - "https://helm.cilium.io/"
  applicationSets:
    hub-local:
      apps:
        # Cilium lives in kube-system (bootstrapped there by build-mesh.sh).
        # Without this, the appset defaults the destination namespace to the
        # app name ("cilium"), and Helm renders the operator/agent RBAC
        # subjects as cilium/<sa>, which crash-loops cilium-operator.
        cilium:
          namespace: kube-system
dexRestarter:
  enabled: false
argo-cd:
  dex:
    enabled: false
  redis:
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 128Mi
  applicationSet:
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 256Mi
  repoServer:
    livenessProbe:
      timeoutSeconds: 10
      periodSeconds: 20
    readinessProbe:
      timeoutSeconds: 10
      periodSeconds: 20
    resources:
      requests:
        cpu: 500m
        memory: 768Mi
      limits:
        memory: 768Mi
    volumeMounts:
      - name: host-ca-certificates
        mountPath: /etc/ssl/certs/ca-certificates.crt
        readOnly: true
    volumes:
      - name: host-ca-certificates
        hostPath:
          path: /etc/ssl/certs/ca-certificates.crt
          type: File
  controller:
    resources:
      requests:
        memory: 2048Mi
      limits:
        memory: 2048Mi
  server:
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 256Mi
    ingressGrpc:
      enabled: false
      annotations:
        cert-manager.io/cluster-issuer: kubara-local-ca-issuer
      tls: true
    ingress:
      enabled: true
      ingressClassName: cilium
      annotations:
        cert-manager.io/cluster-issuer: kubara-local-ca-issuer
      tls: true
  global:
    domain: argocd.hub.kubara.test
  configs:
    rbac:
      policy.default: role:admin
      policy.csv: ""
