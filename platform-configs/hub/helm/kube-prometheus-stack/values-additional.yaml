kube-prometheus-stack:
  prometheusOperator:
    resources:
      requests:
        memory: 100Mi
      limits:
        memory: 100Mi
    prometheusConfigReloader:
      resources:
        requests:
          memory: 100Mi
        limits:
          memory: 100Mi
  prometheus-node-exporter:
    resources:
      requests:
        memory: 100Mi
      limits:
        memory: 100Mi
  prometheus:
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: kubara-local-ca-issuer
      paths:
        - /
      pathType: ImplementationSpecific
      hosts:
        - prometheus.hub.kubara.test
      tls:
        - secretName: tls-prometheus
          hosts:
            - prometheus.hub.kubara.test
    prometheusSpec:
      externalUrl: https://prometheus.hub.kubara.test
      routePrefix: /
      resources:
        requests:
          memory: 384Mi
        limits:
          memory: 384Mi
  alertmanager:
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: kubara-local-ca-issuer
      paths:
        - /
      pathType: ImplementationSpecific
      hosts:
        - alertmanager.hub.kubara.test
      tls:
        - secretName: tls-alertmanager
          hosts:
            - alertmanager.hub.kubara.test
    alertmanagerSpec:
      externalUrl: https://alertmanager.hub.kubara.test
      routePrefix: /
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 128Mi
  grafana:
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: kubara-local-ca-issuer
      path: /
      pathType: ImplementationSpecific
      hosts:
        - grafana.hub.kubara.test
      tls:
        - secretName: tls-grafana
          hosts:
            - grafana.hub.kubara.test
    grafana.ini:
      server:
        root_url: https://grafana.hub.kubara.test/
        serve_from_sub_path: false
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 256Mi
    initChownData:
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 128Mi
    sidecar:
      resources:
        requests:
          memory: 100Mi
        limits:
          memory: 100Mi
  kube-state-metrics:
    resources:
      requests:
        memory: 100Mi
      limits:
        memory: 100Mi
prometheus-blackbox-exporter:
  resources:
    requests:
      memory: 100Mi
    limits:
      memory: 100Mi
