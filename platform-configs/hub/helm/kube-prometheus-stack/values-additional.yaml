kube-prometheus-stack:
  prometheusOperator:
    resources:
      requests:
        memory: 100Mi
      limits:
        memory: 100Mi
    prometheusConfigReloader:
      resources:
        requests:
          memory: 100Mi
        limits:
          memory: 100Mi
  prometheus-node-exporter:
    resources:
      requests:
        memory: 100Mi
      limits:
        memory: 100Mi
  prometheus:
    ingress:
      enabled: true
      annotations: {}
      tls: []
    prometheusSpec:
      resources:
        requests:
          memory: 384Mi
        limits:
          memory: 384Mi
      additionalScrapeConfigs:
        # Static IPs of the spoke control-plane nodes on the kubara-mesh
        # Docker network. These addresses change if the kind cluster is
        # recreated - refresh them after a rebuild with:
        #   docker inspect kubara-spoke-1-control-plane kubara-spoke-2-control-plane
        #   (Cilium runs hostNetwork, so agent/operator/hubble metrics are
        #   reachable on the node IPs at ports 9962/9963/9965).
        - job_name: cilium-spoke-1
          scrape_interval: 30s
          static_configs:
            - targets:
                - 172.19.0.3:9962 # cilium-agent
                - 172.19.0.3:9963 # cilium-operator
                - 172.19.0.3:9965 # hubble metrics
        - job_name: cilium-spoke-2
          scrape_interval: 30s
          static_configs:
            - targets:
                - 172.19.0.4:9962 # cilium-agent
                - 172.19.0.4:9963 # cilium-operator
                - 172.19.0.4:9965 # hubble metrics
  alertmanager:
    ingress:
      enabled: true
      annotations: {}
      tls: []
    alertmanagerSpec:
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 128Mi
  grafana:
    ingress:
      enabled: true
      annotations: {}
      tls: []
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 256Mi
    initChownData:
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 128Mi
    sidecar:
      resources:
        requests:
          memory: 100Mi
        limits:
          memory: 100Mi
  kube-state-metrics:
    resources:
      requests:
        memory: 100Mi
      limits:
        memory: 100Mi
prometheus-blackbox-exporter:
  resources:
    requests:
      memory: 100Mi
    limits:
      memory: 100Mi
