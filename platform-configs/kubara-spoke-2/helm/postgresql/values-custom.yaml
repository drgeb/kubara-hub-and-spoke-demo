# Local overrides for the shared backing postgres on kubara-spoke-2.
#
# Credentials are NEVER stored in this repository; see
# catalogs/backing-services/platform-configs/helm/postgresql/values.generated.yaml.tplt
# and z-demo-setup/scripts/create-platform-secrets.sh
# (POSTGRES_PASSWORD -> postgres-password, APP_POSTGRES_PASSWORD -> password).
#
# The bitnami postgresql 18 image enables the OpenSSL FIPS provider by default
# (OPENSSL_FIPS=yes), which rejects MD5. GoodJob (used by OpenProject for
# background jobs) posts advisory-lock queries that call SQL `md5(...)`, so
# FIPS breaks the seeder/web/worker. Disable the FIPS provider for this demo.
primary:
  extraEnvVars:
    - name: OPENSSL_FIPS
      value: "no"