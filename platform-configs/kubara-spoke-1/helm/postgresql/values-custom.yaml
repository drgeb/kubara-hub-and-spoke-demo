# Local overrides for the shared backing postgres on kubara-spoke-1.
#
# Credentials are NEVER stored in this repository. The postgres superuser
# password (POSTGRES_PASSWORD) and the application user password for forgejo
# (APP_POSTGRES_PASSWORD) live only in the .env file and are written to the
# Kubernetes Secret `postgresql` (namespace: postgresql) by
# z-demo-setup/scripts/create-platform-secrets.sh, which also mirrors them to
# OpenBao. The chart references that Secret instead of rendering its own.
#
# Per-application databases and roles (openproject, keycloak, apicurio) are
# created by the liquibase-bootstrap job, whose passwords also come from .env
# at install time and are never committed. Provisioning is automated by
# z-demo-setup/scripts/provision-platform.sh (invoked by build-mesh.sh after
# the mesh is up and manually via `just provision-platform`); `just
# liquibase-install` remains for a manual cluster-local run.
auth:
  existingSecret: postgresql

# The bitnami postgresql 18 chart enables the OpenSSL FIPS provider by default
# (chart annotation fips: "true" -> OPENSSL_FIPS=yes), which rejects MD5.
# GoodJob (used by OpenProject for background jobs) posts advisory-lock queries
# that call SQL `md5(...)`, so FIPS breaks the seeder/web/worker. Turn it off
# for this demo (renders OPENSSL_FIPS=no).
primary:
  fips:
    openssl: "off"
  # The chart default primary.resourcesPreset is "nano" (request 128Mi / limit
  # 192Mi), which OOM-kills the shared postgres on this 64Gi node during
  # liquibase / app startup. Give it a real budget; pin the preset to "none"
  # (docs: ignored when resources is set) so it cannot silently reset.
  resourcesPreset: "none"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
