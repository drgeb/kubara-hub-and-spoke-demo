# Hand-maintained customization layered over values.generated.yaml.
#
# spoke-1 has no Prometheus Operator (kube-prometheus-stack disabled), so the
# ServiceMonitor rendered by the chart's default (prometheus.serviceMonitor.enabled: true)
# would break the sync with "failed to discover server resources for monitoring.coreos.com/v1".
traefik:
  metrics:
    prometheus:
      serviceMonitor:
        enabled: false
