# Per-cluster wildcard DNS for the kubara hub-and-spoke demo.
# Services resolve as <svc>.<cluster>.kubara.test and map to that cluster's
# traefik LoadBalancer IP on the kubara-mesh Docker network.
# Regenerate the address= lines with `just refresh-lb-hosts`.

listen-address=127.0.0.1
no-resolv
domain-needed
bogus-priv
cache-size=1000
local-ttl=0

address=/hub.kubara.test/172.19.0.2
address=/spoke-1.kubara.test/172.19.0.6
address=/spoke-2.kubara.test/172.19.0.7
address=/dev.kubara.test/172.19.0.3
address=/staging.kubara.test/172.19.0.8
address=/prod.kubara.test/172.19.0.4

# Maven alias -> kubara-spoke-1 Nexus (local builds)
address=/my.nexus.me/172.19.0.6
# Forgejo SSH (separate LoadBalancer on spoke-1). Not a *.kubara.test host:
# parent address= rules would shadow it in dnsmasq's first-match order.
address=/forgejo-ssh.me/172.19.0.5
