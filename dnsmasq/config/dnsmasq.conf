# Per-cluster wildcard DNS for the kubara hub-and-spoke demo.
# Services resolve as <svc>.<cluster>.kubara.test and map to that cluster's
# traefik LoadBalancer IP on the kubara-mesh Docker network.
# Regenerate the address= lines with `just refresh-lb-hosts`.

listen-address=127.0.0.1
no-resolv
domain-needed
bogus-priv
cache-size=1000

address=/hub.kubara.test/172.19.0.2
address=/spoke-1.kubara.test/172.19.0.10
address=/spoke-2.kubara.test/172.19.0.11
address=/dev.kubara.test/172.19.0.13
address=/staging.kubara.test/172.19.0.12
address=/prod.kubara.test/172.19.0.14

# Maven alias -> kubara-spoke-1 Nexus (local builds)
address=/my.nexus.me/172.19.0.10